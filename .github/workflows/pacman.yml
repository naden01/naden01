name: generate arcade contribution graphs

on:
    schedule: # Run automatically every 24 hours
        - cron: '0 0 * * *'
    workflow_dispatch: # Allows manual triggering
    push: # Runs on every push to the main branch
        branches:
            - main

jobs:
    generate:
        permissions:
            contents: write
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env: # <-- Global environment variables for this entire job
            ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
            
        steps:
            # Step 1: Initialize the workspace environment
            - name: Checkout repository
              uses: actions/checkout@v4

            # Step 2: Generate the SVGs (This automatically writes to the 'dist' directory)
            - name: generate contribution graph SVGs
              uses: abozanona/pacman-contribution-graph@main
              with:
                  github_user_name: ${{ github.repository_owner }}
                  # Comma-separated list of game names to generate. Default: pacman
                  games: 'pacman,breakout'

            # Step 3: Upgraded to v4 to clear out Node 20 deprecation errors safely
            - name: push SVGs to the output branch
              uses: crazy-max/ghaction-github-pages@v4
              with:
                  target_branch: output
                  build_dir: dist
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
